<h1>Jasaza local</h1>
<p>Jasaza local es una credencial OAuth de uso personal. La utiliza únicamente su creador para sincronizar su propia carpeta de Google Drive con su equipo mediante la herramienta de código abierto <a href="https://rclone.org">rclone</a>.</p>
<p>No es un servicio público y no tiene otros usuarios.</p>
